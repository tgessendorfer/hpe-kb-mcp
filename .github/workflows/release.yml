# Publishes to PyPI when a v* tag is pushed.
#
# Uses PyPI Trusted Publishing (OIDC), so there is no API token in this
# repository's secrets - PyPI is configured to trust this workflow, in this
# repository, and mints a short-lived credential per run. One-time setup at
#   https://pypi.org/manage/project/hpe-kb-mcp/settings/publishing/
# owner tgessendorfer, repository hpe-kb-mcp, workflow release.yml.
#
# To cut a release: bump __version__ in hpe_kb_mcp/__init__.py (the single
# source - pyproject and the server's serverInfo both read it), commit, then
#   git tag v0.1.0 && git push origin v0.1.0
# A version can never be re-uploaded to PyPI, so the guard below refuses to
# publish when the tag and __version__ disagree.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check the tag matches __version__
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          pkg=$(python -c "import re,pathlib; \
            print(re.search(r'__version__ = \"([^\"]+)\"', \
            pathlib.Path('hpe_kb_mcp/__init__.py').read_text()).group(1))")
          echo "tag=$tag  __version__=$pkg"
          test "$tag" = "$pkg" || { echo "::error::tag v$tag does not match __version__ $pkg"; exit 1; }

      - name: Build
        run: |
          pip install build twine
          python -m build
          twine check dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
