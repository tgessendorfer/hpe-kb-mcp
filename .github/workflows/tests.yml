name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor from pyproject, the version deployed on the Rocky 9 VM, and
        # the current release.
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e .

      # The suite is offline by design - fixtures mimic the shape of HPE's
      # payloads, never their content - so it needs no secrets and never talks
      # to support.hpe.com.
      - name: Test
        run: python -m unittest discover -s tests -t . --verbose

      - name: Check the server starts and reports its version
        run: |
          python - <<'PY'
          import asyncio
          from hpe_kb_mcp import __version__
          from hpe_kb_mcp.server import mcp
          assert mcp.version == __version__, mcp.version
          names = sorted(t.name for t in asyncio.run(mcp.list_tools()))
          print(f"hpe-kb {mcp.version}: {', '.join(names)}")
          PY
